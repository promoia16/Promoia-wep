<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promo IA - Generador Viral</title>
<style>
body{background:#050505;color:#00ff88;font-family:monospace;padding:20px;max-width:700px;margin:auto}
h1{border-bottom:2px solid #00ff88;padding-bottom:10px}
input,button{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #00ff88;background:#111;color:#00ff88;font-size:16px}
button{background:#00ff88;color:#000;font-weight:900;cursor:pointer}
.card{background:#151515;border:1px solid #00ff88;padding:15px;margin:15px 0;border-radius:12px}
</style>
</head>
<body>
<h1>> PROMO_IA // GENERADOR</h1>
<input id="idea" placeholder="Escribe tu idea: ej. vender casas, bajar de peso">
<button onclick="generar()">GENERAR CONTENIDO VIRAL</button>
<div id="res"></div>
<script>
function generar(){
let v=document.getElementById('idea').value;
if(!v){alert('Escribe una idea');return}
document.getElementById('res').innerHTML=`
<div class="card"><h3>HOOK 1 - Impacto</h3><p>Deja de hacer ${v} así... Haz esto que usan los pros</p></div>
<div class="card"><h3>HOOK 2 - Secreto</h3><p>El secreto de ${v} que nadie te quiere decir</p></div>
<div class="card"><h3>HOOK 3 - Error</h3><p>El error #1 que todos cometen en ${v}</p></div>
<div class="card"><h3>GUION 30s</h3><p>[0-3s] ¿Luchas con ${v}?<br>[3-15s] Paso 1, 2 y 3 que nadie hace<br>[15-25s] Resultado real<br>[25-30s] Sígueme para más de ${v}</p></div>
<div class="card"><h3>CTA</h3><p>Comenta "${v}" y te mando la guía</p></div>
`;
}
</script>
</body>
</html>
